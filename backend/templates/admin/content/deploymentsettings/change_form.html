{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block extrahead %}
  {{ block.super }}
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const provider = document.getElementById("id_email_provider");
      const panels = document.querySelectorAll(".email-provider-panel");
      if (!provider || !panels.length) return;
      const refreshPanels = function () {
        panels.forEach(function (panel) {
          panel.hidden = !panel.classList.contains("email-provider-" + provider.value);
        });
      };
      provider.addEventListener("change", refreshPanels);
      refreshPanels();
    });
  </script>
{% endblock %}

{% block submit_buttons_bottom %}
  <div class="submit-row">
    <input type="submit" value="保存" class="default" name="_save">
    <input type="submit" value="保存并发送测试邮件" name="_send_test_email">
  </div>
{% endblock %}
